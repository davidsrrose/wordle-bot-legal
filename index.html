<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wordle Bot</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    color:#f8fafc;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px;
}

.card{
    max-width:760px;
    width:100%;
    background:rgba(255,255,255,.05);
    backdrop-filter:blur(20px);
    border:1px solid rgba(255,255,255,.08);
    border-radius:24px;
    padding:60px;
    text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.35);
}

.logo{
    font-size:72px;
    margin-bottom:20px;
}

h1{
    font-size:3rem;
    margin-bottom:12px;
}

.subtitle{
    font-size:1.15rem;
    color:#cbd5e1;
    line-height:1.7;
    margin-bottom:40px;
}

.features{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:20px;
    margin-bottom:50px;
}

.feature{
    background:rgba(255,255,255,.04);
    border-radius:16px;
    padding:20px;
}

.feature h3{
    margin-bottom:8px;
}

footer{
    border-top:1px solid rgba(255,255,255,.08);
    padding-top:25px;
    color:#94a3b8;
}

a{
    color:#60a5fa;
    text-decoration:none;
    margin:0 12px;
}

a:hover{
    text-decoration:underline;
}
</style>

</head>

<body>

<div class="card">

<div class="logo">🟩🟨⬜</div>

<h1>Wordle Bot</h1>

<p class="subtitle">
A tiny personal SMS bot that sends daily Wordle results and an optional AI-generated haiku to subscribed friends.
</p>

<div class="features">

<div class="feature">
<h3>📅 Daily</h3>
<p>One message each day.</p>
</div>

<div class="feature">
<h3>🧩 Wordle</h3>
<p>Automatically shares the daily score.</p>
</div>

<div class="feature">
<h3>🤖 AI</h3>
<p>Includes an optional short haiku.</p>
</div>

</div>

<footer>
<a href="privacy.html">Privacy Policy</a>
•
<a href="terms.html">Terms & Conditions</a>
</footer>

</div>

</body>
</html>
